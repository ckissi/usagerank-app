[package]
name = "usagerank"
version = "0.1.4"
description = "UsageRank menu bar app: pushes Claude Code and Codex token usage to the leaderboard"
authors = ["Csaba Kissi"]
edition = "2021"

[lib]
name = "usagerank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
ed25519-dalek = "2"
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
chrono = "0.4"
iana-time-zone = "0.1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tiny-skia = "0.11"
fontdue = "0.9"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-service-management = "0.3"
objc2-foundation = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-autostart = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
